name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List iPhone simulators
        run: xcrun simctl list devices available | grep -E "iPhone" | head -10

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrackGym.xcodeproj \
            -scheme TrackGym \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build

      - name: Test (iOS Simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "iPhone" | sed -nE 's/.*\(([0-9A-F-]{36})\) \((Shutdown|Booted)\).*/\1/p' | head -1)
          if [ -z "$DEST" ]; then
            echo "::error::No suitable iPhone simulator found"
            exit 1
          fi
          echo "Using simulator $DEST"
          # Boot and wait so the test host does not race a booting simulator.
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild test \
            -project TrackGym.xcodeproj \
            -scheme TrackGym \
            -destination "id=$DEST" \
            -configuration Debug \
            -only-testing:TrackGymTests \
            -only-testing:TrackGymUITests

  watchos:
    name: watchOS Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build (watchOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrackGym.xcodeproj \
            -scheme 'TrackGym Watch App Watch App' \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            build

      - name: Test (watchOS Simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "Apple Watch" | sed -nE 's/.*\(([0-9A-F-]{36})\) \((Shutdown|Booted)\).*/\1/p' | head -1)
          if [ -z "$DEST" ]; then
            echo "::error::No suitable Apple Watch simulator found"
            exit 1
          fi
          echo "Using simulator $DEST"
          # Boot and wait: launching the test host on a still-booting watch
          # simulator races with the runner and fails with
          # "Busy (Application has termination assertions)".
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
          run_tests() {
            xcodebuild test \
              -project TrackGym.xcodeproj \
              -scheme 'TrackGym Watch App Watch App' \
              -destination "id=$DEST" \
              -configuration Debug \
              -only-testing:'TrackGym Watch App Watch AppTests'
          }
          # One retry: the remaining failure mode is a simulator launch race,
          # not a test failure, and it does not reproduce on a warm device.
          run_tests || {
            echo "::warning::watchOS test run failed, retrying once"
            xcrun simctl shutdown "$DEST" || true
            xcrun simctl boot "$DEST"
            xcrun simctl bootstatus "$DEST" -b
            run_tests
          }
